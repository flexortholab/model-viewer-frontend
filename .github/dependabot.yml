# Mantiene al dia las acciones de GitHub: una PR al mes con todas las
# versiones nuevas juntas. El titulo lleva el prefijo `ci:` para pasar la
# comprobacion de Conventional Commits.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      acciones:
        patterns: ['*']
