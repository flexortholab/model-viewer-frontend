name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Cola de merge: al pulsar "Merge when ready" la PR se prueba sobre main con
  # el cambio encima y solo se mergea si pasa.
  merge_group:

# En una PR, un push nuevo cancela el run anterior, que ya no sirve. En main el
# grupo es por commit: nunca se cancela el despliegue de otro merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Tests unitarios
        run: npm test

      - name: Build de produccion
        run: npm run build

      - name: Guardar la web para publicarla
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Guardar la web para publicarla en AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist
          if-no-files-found: error
          retention-days: 7

  # Pruebas en navegador (Playwright): un job por navegador, en paralelo. Cada
  # job corre todos los perfiles de ese navegador (escritorio, portatil
  # tactil, tablet, movil). Sin reintentos y con cada test repetido dos veces
  # en el CI: un test inestable lo deja en rojo. No corre en cada push a
  # una PR, sino al integrar: en la cola de merge y en el push a main (por si
  # un merge se salta la cola, que nunca se publique sin probar).
  e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        navegador: [chromium, firefox, webkit, msedge]
    env:
      E2E_NAVEGADOR: ${{ matrix.navegador }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Version de Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Edge se instala como paquete del sistema (fuera de la cache); el resto
      # de navegadores se guardan en la cache por version de Playwright.
      - name: Cache de navegadores
        if: matrix.navegador != 'msedge'
        id: cache-navegadores
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.navegador }}

      - name: Instalar el navegador
        if: steps.cache-navegadores.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.navegador }}

      - name: Dependencias del sistema del navegador
        if: steps.cache-navegadores.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.navegador }}

      # Firefox headless en Linux no encuentra driver de GL y no crea el
      # contexto WebGL: se lanza con ventana sobre un X virtual (Mesa).
      - name: Pruebas en ${{ matrix.navegador }}
        run: ${{ matrix.navegador == 'firefox' && 'xvfb-run --auto-servernum npx playwright test --headed' || 'npx playwright test' }} --repeat-each=2

      - name: Guardar el informe y las trazas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.navegador }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Check que exige la regla de main: un nombre estable para toda la matriz.
  # En una PR e2e se salta y esto sale en verde; en la cola refleja la matriz.
  e2e-resultado:
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Resultado de las pruebas en navegador
        run: |
          echo "e2e: ${{ needs.e2e.result }}"
          test "${{ needs.e2e.result }}" != failure && test "${{ needs.e2e.result }}" != cancelled

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # La misma web, tambien en https://viewer.flexortholab.com (S3 + CloudFront,
  # infraestructura en model-viewer-backend). Convive con Pages hasta nueva
  # orden. Sin environment: con uno, el subject OIDC cambia y AWS solo acepta
  # el de refs/heads/main.
  deploy-aws:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: aws-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web
          path: dist

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-south-2
          role-to-assume: arn:aws:iam::576951332538:role/model-viewer-prod-web-deploy
          role-session-name: model-viewer-frontend-${{ github.run_id }}

      - name: Publicar en viewer.flexortholab.com
        run: scripts/publicar-aws.sh dist
