<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Visor de disyuntores sinterizados</title>
    <script type="module" crossorigin src="./assets/index-C4MoJpv1.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-F6n7fjyE.css">
  </head>
  <body>
    <div id="app">
      <div id="viewport">
        <div id="labels" aria-live="polite"></div>
        <div id="leftbar" class="col">
        <div id="views-bar" class="toolbar" role="toolbar" aria-label="Vistas">
          <span class="tb-title">Vistas</span>
          <div class="tb-group views-group">
            <button type="button" data-action="frame" title="Encuadrar (F)">Encuadrar</button>
            <button type="button" data-view="frontal" title="Vista frontal (anterior)">Frontal</button>
            <button type="button" data-view="superior" title="Vista superior (oclusal)">Superior</button>
            <button type="button" data-view="inferior" title="Vista inferior">Inferior</button>
            <button type="button" data-view="izquierda" title="Vista lateral izquierda">Izquierda</button>
            <button type="button" data-view="derecha" title="Vista lateral derecha">Derecha</button>
            <button type="button" data-view="isometrica" title="Vista isométrica">Isométrica</button>
          </div>
          <div id="viewcube" title="Cubo de vistas: pulsa una cara para ir a esa vista">
            <div id="viewcube-inner">
              <button type="button" class="cube-face face-frontal" data-cube="frontal">Frontal</button>
              <button type="button" class="cube-face face-trasera" data-cube="trasera">Trasera</button>
              <button type="button" class="cube-face face-izquierda" data-cube="izquierda">Izq.</button>
              <button type="button" class="cube-face face-derecha" data-cube="derecha">Der.</button>
              <button type="button" class="cube-face face-superior" data-cube="superior">Sup.</button>
              <button type="button" class="cube-face face-inferior" data-cube="inferior">Inf.</button>
            </div>
          </div>
        </div>
        <div id="tools-bar" class="toolbar" role="toolbar" aria-label="Herramientas del visor">
          <span class="tb-title">Herramientas</span>
          <div class="tb-group">
            <button type="button" data-action="move" aria-pressed="false" title="Volver a la cámara libre (mover la pieza)">
              Mover
            </button>
            <button type="button" data-action="measure" aria-pressed="false" title="Medir (M)">
              Medir
            </button>
            <button type="button" data-action="add-marker" aria-pressed="false" title="Añadir marcador (K)">
              Marcador
            </button>
            <button type="button" data-action="clear-markers" title="Borrar todos los marcadores">
              Borrar marcadores
            </button>
            <button type="button" data-action="clear-measurements" title="Borrar medidas">
              Borrar medidas
            </button>
          </div>
          <div class="tb-group">
            <button type="button" data-action="export" title="Descargar anotaciones (E)">
              Exportar
            </button>
          </div>
        </div>
        </div>

        <div id="hint" class="hint"></div>
        <img id="brand-logo" src="./logo.png" alt="Logotipo del laboratorio" />

        <div id="rightbar" class="col">
        <div id="panel" class="panel" hidden>
          <div class="panel-head">
            <strong>Corte seccional</strong>
            <button type="button" class="panel-toggle" data-action="toggle-panel" aria-label="Plegar">
              -
            </button>
          </div>
          <div class="panel-body">
            <label class="switch">
              <input type="checkbox" id="section-enabled" />
              <span>Activar corte</span>
            </label>

            <button type="button" class="wide" data-action="section-reset" title="Coloca el plano en el centro de la pieza, perpendicular a la vista actual">
              Alinear con la vista
            </button>
            <button type="button" class="wide" data-action="section-orient" title="Rota el plano 90 grados en el sitio (de frente a perfil y viceversa)">
              Girar 90 grados
            </button>
          </div>
        </div>

        <div id="objects-panel" class="panel objects" hidden>
          <div class="panel-head">
            <strong>Objetos</strong>
            <span id="objects-count" class="count"></span>
            <button type="button" class="panel-toggle" data-action="toggle-objects" aria-label="Plegar">
              -
            </button>
          </div>
          <div class="panel-body">
            <ul id="objects-list" class="obj-list"></ul>
          </div>
        </div>

        <div id="markers-panel" class="panel markers" hidden>
          <div class="panel-head">
            <strong>Presentación</strong>
            <span id="markers-count" class="count"></span>
            <button type="button" class="panel-toggle" data-action="toggle-markers" aria-label="Plegar">
              +
            </button>
          </div>
          <div class="panel-body">
            <button type="button" class="wide" data-action="marker-unfocus">
              Vista libre (salir del paso)
            </button>
            <ul id="markers-list" class="marker-list"></ul>
            <p class="panel-note">Pulsa un paso: restaura vista, corte y medidas guardadas. ✂ en Objetos centra el corte en una pieza.</p>
          </div>
        </div>
        </div>
      </div>
    </div>

  </body>
</html>
