<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Visor de disyuntores sinterizados</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="viewport">
        <div id="labels" aria-live="polite"></div>
        <div id="toolbars">
        <div id="toolbar" role="toolbar" aria-label="Herramientas del visor">
          <div class="tb-group">
            <button type="button" data-action="frame" title="Encuadrar (F)">Encuadrar</button>
            <button type="button" data-view="frontal" title="Vista frontal">Frontal</button>
            <button type="button" data-view="superior" title="Vista superior (oclusal)">Superior</button>
            <button type="button" data-view="lateral" title="Vista lateral">Lateral</button>
            <button type="button" data-view="lingual" title="Vista lingual (palatina)">Lingual</button>
            <button type="button" data-view="isometrica" title="Vista isométrica">Isométrica</button>
          </div>
          <div class="tb-group">
            <button type="button" data-action="measure" aria-pressed="false" title="Medir (M)">
              Medir
            </button>
            <button type="button" data-action="add-marker" aria-pressed="false" title="Añadir marcador (K)">
              Marcador
            </button>
            <button type="button" data-action="clear-markers" title="Borrar todos los marcadores">
              Borrar marcadores
            </button>
            <button type="button" data-action="clear-measurements" title="Borrar medidas">
              Borrar medidas
            </button>
          </div>
          <div class="tb-group">
            <button type="button" data-action="export" title="Descargar anotaciones (E)">
              Exportar
            </button>
          </div>
        </div>
        </div>

        <div id="hint" class="hint"></div>

        <div id="status" class="status">
          <span id="status-units" class="badge" hidden></span>
          <span id="status-info"></span>
        </div>

        <div id="panel" class="panel" hidden>
          <div class="panel-head">
            <strong>Corte seccional</strong>
            <button type="button" class="panel-toggle" data-action="toggle-panel" aria-label="Plegar">
              -
            </button>
          </div>
          <div class="panel-body">
            <label class="switch">
              <input type="checkbox" id="section-enabled" />
              <span>Activar corte</span>
            </label>

            <label class="field">
              <span>Superficie de corte</span>
              <select id="cap-color-mode">
                <option value="auto" selected>Color de cada pieza</option>
                <option value="dental">Neutro dental</option>
                <option value="rojo">Rojo ficha técnica</option>
              </select>
            </label>

            <button type="button" class="wide" data-action="section-reset" title="Coloca el plano en el centro de la pieza, perpendicular a la vista actual">
              Alinear con la vista
            </button>
          </div>
        </div>

        <div id="objects-panel" class="panel objects is-collapsed" hidden>
          <div class="panel-head">
            <strong>Objetos</strong>
            <span id="objects-count" class="count"></span>
            <button type="button" class="panel-toggle" data-action="toggle-objects" aria-label="Plegar">
              +
            </button>
          </div>
          <div class="panel-body">
            <ul id="objects-list" class="obj-list"></ul>
          </div>
        </div>

        <div id="markers-panel" class="panel markers" hidden>
          <div class="panel-head">
            <strong>Presentación</strong>
            <span id="markers-count" class="count"></span>
            <button type="button" class="panel-toggle" data-action="toggle-markers" aria-label="Plegar">
              +
            </button>
          </div>
          <div class="panel-body">
            <button type="button" class="wide" data-action="marker-unfocus">
              Vista libre (salir del paso)
            </button>
            <ul id="markers-list" class="marker-list"></ul>
            <p class="panel-note">Pulsa un paso: restaura vista, corte y medidas guardadas. ✂ en Objetos centra el corte en una pieza.</p>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
