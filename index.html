<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Visor de disyuntores sinterizados</title>
    <script type="module" crossorigin src="./assets/index-CoTe2iPq.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bv5GfWNy.css">
  </head>
  <body>
    <div id="app">
      <div id="viewport">
        <div id="labels" aria-live="polite"></div>
        <div id="doc-title" class="doc-title" hidden></div>
        <div id="loader" class="loader" hidden>
          <span class="loader-ring" aria-hidden="true"></span>
          <span id="loader-text">Cargando modelo…</span>
        </div>
        <div id="leftbar" class="col">
        <div id="views-bar" class="toolbar" role="toolbar" aria-label="Vistas">
          <span class="tb-title">Vistas</span>
          <div class="tb-group views-cross">
            <button type="button" data-view="superior" title="Vista superior (oclusal)">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5v-9m0 0L5 7.5M8 4.5l3 3"/></svg>
              <span class="btn-label">Superior</span>
            </button>
            <button type="button" data-view="izquierda" title="Vista lateral izquierda">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8h-9m0 0 3-3m-3 3 3 3"/></svg>
              <span class="btn-label">Izquierda</span>
            </button>
            <button type="button" data-view="frontal" title="Vista frontal (anterior)">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg>
              <span class="btn-label">Frontal</span>
            </button>
            <button type="button" data-view="derecha" title="Vista lateral derecha">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8h9m0 0-3-3m3 3-3 3"/></svg>
              <span class="btn-label">Derecha</span>
            </button>
            <button type="button" data-view="inferior" title="Vista inferior">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v9m0 0 3-3M8 11.5 5 8.5"/></svg>
              <span class="btn-label">Inferior</span>
            </button>
          </div>
          <div class="tb-group views-extra">
            <button type="button" data-view="isometrica" title="Vista isométrica">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8 13.5 5v6L8 14.2 2.5 11V5z"/><path d="M8 1.8V8m0 0 5.5-3M8 8 2.5 5"/></svg>
              <span class="btn-label">Isométrica</span>
            </button>
          </div>
        </div>
        <div id="tools-bar" class="panel tools" role="toolbar" aria-label="Herramientas del visor">
          <div class="panel-head">
            <strong>Herramientas</strong>
            <button type="button" class="panel-toggle" data-action="toggle-tools" aria-label="Plegar">
              -
            </button>
          </div>
          <div class="panel-body">
            <div class="tb-group">
              <button type="button" data-action="measure" aria-pressed="false" title="Medir (M)">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 12.5 12.5 2.5l1.8 1.8-2 2-1.8-1.8-1.2 1.2 1.8 1.8-2 2-1.8-1.8-1.2 1.2 1.8 1.8-2.1 2.1-2.3-2.3z"/></svg>
                Medir
              </button>
              <button type="button" data-action="clear-measurements" title="Borrar medidas">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 12.5 9 6l2.5 2.5L5 15H2.5v-2.5z"/><path d="M11.5 1.5l3 3m0-3-3 3"/></svg>
                Borrar medidas
              </button>
              <button type="button" data-action="add-marker" aria-pressed="false" title="Añadir marcador (K)">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14.5S3.8 10.2 3.8 6.9A4.2 4.2 0 0 1 8 2.7a4.2 4.2 0 0 1 4.2 4.2c0 3.3-4.2 7.6-4.2 7.6z"/><circle cx="8" cy="6.9" r="1.5"/></svg>
                Marcador
              </button>
              <button type="button" data-action="clear-markers" title="Borrar todos los marcadores">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14.5S3.8 10.2 3.8 6.9A4.2 4.2 0 0 1 8 2.7a4.2 4.2 0 0 1 4.2 4.2c0 3.3-4.2 7.6-4.2 7.6z"/><path d="M11.5 1.5l3 3m0-3-3 3"/></svg>
                Borrar marcadores
              </button>
            </div>
            <div class="tb-group">
              <button type="button" data-action="export" title="Descargar anotaciones (E)">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5v8m0 0L5.2 6.7M8 9.5l2.8-2.8"/><path d="M2.5 11.5v3h11v-3"/></svg>
                Exportar
              </button>
            </div>
          </div>
        </div>

        <div id="panel" class="panel" hidden>
          <div class="panel-head">
            <strong>Corte seccional</strong>
            <button type="button" class="panel-toggle" data-action="toggle-panel" aria-label="Plegar">
              -
            </button>
          </div>
          <div class="panel-body">
            <button type="button" class="wide" id="section-toggle" data-action="section-toggle" aria-pressed="false" title="Activa o desactiva el corte seccional">
              <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="4" cy="4" r="2.2"/><circle cx="4" cy="12" r="2.2"/><path d="M5.8 5.8 14 14M5.8 10.2 14 2"/></svg>
              Activar corte
            </button>

            <button type="button" class="wide" data-action="section-reset" title="Coloca el plano en el centro de la pieza, perpendicular a la vista actual">
              <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/><path d="M8 1v3M8 12v3M1 8h3M12 8h3"/></svg>
              Alinear con la vista
            </button>
            <button type="button" class="wide" data-action="section-orient" title="Rota el plano 90 grados en el sitio (de frente a perfil y viceversa)">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-2-4.2"/><path d="M13.5 1.5v4h-4"/></svg>
              Girar 90 grados
            </button>
          </div>
        </div>
        </div>

        <div id="hint" class="hint"></div>
        <div id="viewcube" title="Cubo de vistas: pulsa una cara para ir a esa vista">
          <div id="viewcube-inner">
            <button type="button" class="cube-face face-frontal" data-cube="frontal">Frontal</button>
            <button type="button" class="cube-face face-trasera" data-cube="trasera">Trasera</button>
            <button type="button" class="cube-face face-izquierda" data-cube="izquierda">Izq.</button>
            <button type="button" class="cube-face face-derecha" data-cube="derecha">Der.</button>
            <button type="button" class="cube-face face-superior" data-cube="superior">Sup.</button>
            <button type="button" class="cube-face face-inferior" data-cube="inferior">Inf.</button>
          </div>
        </div>
        <img id="brand-logo" src="./logo.svg" alt="Flex Ortholab, laboratorio digital" />

        <div id="rightbar" class="col">
        <div id="objects-panel" class="panel objects" hidden>
          <div class="panel-head">
            <strong>Objetos</strong>
            <span id="objects-count" class="count"></span>
            <button type="button" class="panel-toggle" data-action="toggle-objects" aria-label="Plegar">
              -
            </button>
          </div>
          <div class="panel-body">
            <ul id="objects-list" class="obj-list"></ul>
          </div>
        </div>

        <div id="markers-panel" class="panel markers" hidden>
          <div class="panel-head">
            <strong>Presentación</strong>
            <span id="markers-count" class="count"></span>
            <button type="button" class="panel-toggle" data-action="toggle-markers" aria-label="Plegar">
              +
            </button>
          </div>
          <div class="panel-body">
            <button type="button" class="wide" data-action="marker-unfocus">
              Vista libre (salir del paso)
            </button>
            <ul id="markers-list" class="marker-list"></ul>
            <p class="panel-note">Pulsa un paso: restaura vista, corte y medidas guardadas. ✂ en Objetos centra el corte en una pieza.</p>
          </div>
        </div>
        </div>
      </div>
    </div>

  </body>
</html>
