<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Panel del visor</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/panel.css" />
  </head>
  <body class="panel-page">
    <header class="app-header">
      <div class="app-header-inner">
        <a class="app-brand" href="./">
          <img class="app-logo" src="./logo.svg" alt="Flex Ortholab, laboratorio digital" />
          <span class="app-brand-text">Panel del laboratorio</span>
        </a>
        <span id="panel-user" class="panel-user" hidden>
          <span id="user-email"></span>
          <button type="button" class="link-button" data-action="logout">Cerrar sesión</button>
        </span>
      </div>
    </header>

    <main class="panel-main">
      <section id="signed-in" class="cases-card" hidden>
        <header class="cases-card-head">
          <h1 class="cases-title">Casos <span id="cases-count" class="cases-count"></span></h1>
          <button type="button" class="button-solid" data-action="new-case">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
            Nuevo caso
          </button>
        </header>

        <form id="new-case" class="new-case" novalidate hidden>
          <div class="new-case-fields">
            <label class="modal-field">
              Nombre del caso
              <input name="name" type="text" maxlength="200" autocomplete="off" required />
            </label>
            <label class="modal-field">
              Modelo (GLB, hasta 500 MB)
              <input name="model" type="file" accept=".glb,model/gltf-binary" required />
            </label>
          </div>
          <p id="new-case-status" class="new-case-status" role="status" hidden></p>
          <p id="new-case-error" class="modal-error" role="alert" hidden></p>
          <div class="modal-actions">
            <button type="button" data-action="cancel-new-case">Cancelar</button>
            <button type="submit" class="button-solid">Crear y subir</button>
          </div>
        </form>

        <p id="cases-message" class="cases-message" role="status">Cargando casos…</p>

        <div id="cases-empty" class="cases-empty" hidden>
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M10 14h11l3 4h14v18H10z" />
            <path d="M24 23v8M20 27h8" />
          </svg>
          <p>Todavía no hay casos</p>
          <button type="button" class="button-solid" data-action="new-case">Crear el primer caso</button>
        </div>

        <table id="cases" class="cases-table" hidden>
          <thead>
            <tr>
              <th scope="col" data-sort-key="name"><button type="button" class="sort-button" data-sort="name">Caso<span class="sort-indicator"></span></button></th>
              <th scope="col" class="col-date" data-sort-key="createdAt"><button type="button" class="sort-button" data-sort="createdAt">Creado<span class="sort-indicator"></span></button></th>
              <th scope="col" class="col-date" data-sort-key="updatedAt" aria-sort="descending"><button type="button" class="sort-button" data-sort="updatedAt">Actualizado<span class="sort-indicator"></span></button></th>
              <th scope="col" data-sort-key="linkGeneratedAt"><button type="button" class="sort-button" data-sort="linkGeneratedAt">Enlace del doctor<span class="sort-indicator"></span></button></th>
              <th scope="col"><span class="visually-hidden">Acciones</span></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <button type="button" id="load-more" class="load-more" data-action="load-more" hidden>Cargar más</button>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <div id="delete-dialog" class="modal" hidden>
      <div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="delete-title">
        <div class="modal-head"><strong id="delete-title">Borrar caso</strong></div>
        <p class="delete-text">
          ¿Borrar el caso <strong id="delete-case-name"></strong>? Se borran el modelo y los marcadores, y si tiene enlace
          el doctor dejará de poder abrirlo. No se puede deshacer.
        </p>
        <p id="delete-error" class="modal-error" role="alert" hidden></p>
        <div class="modal-actions">
          <button type="button" data-action="cancel-delete">Cancelar</button>
          <button type="button" class="danger" data-action="confirm-delete">Borrar</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/panel.js"></script>
  </body>
</html>
