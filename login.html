<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Acceso al panel</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/panel.css" />
  </head>
  <body class="panel-page login-page">
    <main class="login-main">
      <div class="login-brand">
        <img class="login-logo" src="./logo.svg" alt="Flex Ortholab, laboratorio digital" />
        <p class="login-subtitle">Panel del laboratorio</p>
      </div>

      <form id="login" class="login-card" novalidate hidden>
        <h1 class="login-title">Acceso</h1>
        <label class="modal-field">
          Email
          <input name="email" type="email" autocomplete="username" required />
        </label>
        <label class="modal-field">
          Contraseña
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="modal-error" role="alert" hidden></p>
        <button type="submit" class="button-solid button-wide">Entrar</button>
      </form>
    </main>
    <footer class="login-footer">Flex Ortholab · Laboratorio digital</footer>
    <script type="module" src="./src/login.js"></script>
  </body>
</html>
